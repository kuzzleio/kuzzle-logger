name: Push and PR

on:
  push:
    branches:
      - main
      - '[0-9]+-dev'
  pull_request:

# Read-only by default: the release job asks for the write permissions it needs
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run test:lint

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Run types tests
        run: npm run test:types

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [lint, check-types]
    strategy:
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Lint already runs in its own job
      - name: Run tests
        run: npm run test:functional

  packaging:
    name: Packaging (build, smoke tests, browser bundle size)
    runs-on: ubuntu-latest
    needs: [lint, check-types]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run smoke tests
        run: npm run test:smoke

  release:
    name: Release process
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || endsWith(github.ref_name, '-dev')) }}
    needs: [functional-tests, packaging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required by npm trusted publishing (OIDC): @semantic-release/npm
      # exchanges the GitHub Actions ID token for a short-lived npm token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Names the changelog file (changelogs/CHANGELOG_<channel>.md). Without
          # it, the shared config falls back to the branch name (CHANGELOG_1-dev.md).
          RELEASE_CHANNEL: ${{ endsWith(github.ref_name, '-dev') && 'dev' || github.ref_name }}
          SEMANTIC_RELEASE_NPM_PUBLISH: 'true'
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release

  documentation_deploy:
    needs: [release]
    name: Documentation - Deploy
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || endsWith(github.ref_name, '-dev')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: convictional/trigger-workflow-and-wait@f69fa9eedd3c62a599220f4d5745230e237904be # v1.6.5
        with:
          owner: kuzzleio
          repo: documentation
          github_token: ${{ secrets.ACCESS_TOKEN_CI }}
          workflow_file_name: child_repo.workflow.yml
          ref: ${{ github.ref_name == 'main' && 'master' || 'develop' }}
          client_payload: '{"repo_name":"kuzzle-logger","branch":"${{ github.ref_name }}","version":"1"}'
